name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every commit on main gets its own group, so no main run is cancelled or
# collapsed into a later one and each commit keeps its own result and
# Codecov status; other refs share a group per ref and cancel superseded
# runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out typesafe-sdk-python at the pinned upstream commit
        uses: actions/checkout@v7
        with:
          repository: typesafe-ai/typesafe-sdk-python
          ref: 0ffd094c72ed9445223060b24ffd7a56aa781fb4
          path: upstream
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The formatters of golangci-lint run see only the files of the packages
      # that this runner's build loads, so they miss the files built only for
      # another platform or Go release (internal/codec/unsupported.go,
      # internal/codec/validate_arm64.go, internal/testsupport/guard_other.go).
      # fmt walks every tracked Go file instead, those three included, with
      # the same gofumpt and goimports settings. Any output fails the step: a
      # diff, or the warning fmt prints for a file it cannot parse, for which
      # it exits 0.
      - name: golangci-lint fmt --diff
        run: |
          rc=0
          out="$(golangci-lint fmt --diff 2>&1)" || rc=$?
          if [ -n "$out" ] || [ "$rc" -ne 0 ]; then
            printf 'golangci-lint fmt --diff (exit status %s):\n%s\n' "$rc" "$out"
            exit 1
          fi

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck, go mod tidy
        run: |
          govulncheck ./... && go mod tidy -diff

      # setup-uv publishes no floating major tag (only vX.Y.Z tags since v8), so
      # the major-only pin rule cannot apply; Dependabot bumps this full version.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Test the checker scripts
        run: uvx --with pyyaml pytest -q -p no:cacheprovider .github/scripts

      - name: Check the port test matrix against the upstream tests
        run: uv run --script .github/scripts/port-test-matrix.py --upstream upstream --deviations docs/deviations.md --as-built docs/as-built.md

      - name: Every Go block in README.md and docs/ equals its examples/ source (XD1)
        run: uv run --script .github/scripts/docs-snippets.py --readme README.md --docs docs --examples examples

      # The examples are the Go counterpart of the Python SDK's positive
      # typing fixtures, so they must compile; golangci-lint above
      # type-checks and vets every package, the examples included. This
      # step fails when examples/ holds no program or one that go list does
      # not report as a package, so ./... cannot leave one out.
      - name: The examples are packages (XT1)
        run: |
          mapfile -t dirs < <(git ls-files -- 'examples/*.go' | grep -v '_test\.go$' | xargs -r -n1 dirname | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::examples/ holds no Go program"
            exit 1
          fi
          module="$(go list -m)"
          listed="$(go list ./examples/... | sed "s#^$module/##" | sort -u)"
          want="$(printf '%s\n' "${dirs[@]}")"
          if [ "$listed" != "$want" ]; then
            printf '::error::go list ./examples/... reports [%s] where examples/ holds [%s]\n' "${listed//$'\n'/ }" "${want//$'\n'/ }"
            exit 1
          fi
          echo "${#dirs[@]} example programs: ${dirs[*]}"

      # Off the support matrix internal/codec must refuse to compile, and go
      # vet and go build must both exit non-zero with output naming the D1
      # identifier. -tags go1.28 stands in for a Go 1.28 toolchain.
      - name: D1 refusal off the support matrix
        env:
          D1_IDENTIFIER: typesafe_sdk_go_requires_go1_17_to_go1_27_on_amd64_or_arm64
        run: |
          # The refusal is the expected output. Drop setup-go's Go problem
          # matcher (owner "go") so that it is not reported as an error
          # annotation; this is the lint job's last step for that reason.
          echo "::remove-matcher owner=go::"
          for t in 'GOOS=linux GOARCH=386' 'GOOS=linux GOARCH=riscv64' 'GOFLAGS=-tags=go1.28'; do
            for cmd in vet build; do
              echo "::group::env $t go $cmd ./internal/codec/"
              # $t is split on purpose: env(1) applies each assignment.
              # shellcheck disable=SC2086
              if out="$(env $t go "$cmd" ./internal/codec/ 2>&1)"; then
                printf '%s\n' "$out"
                echo "::error::env $t go $cmd ./internal/codec/ succeeded: the D1 refusal is gone"
                exit 1
              fi
              printf '%s\n' "$out"
              echo "::endgroup::"
              if ! grep -qF "$D1_IDENTIFIER" <<<"$out"; then
                echo "::error::env $t go $cmd ./internal/codec/ failed without naming $D1_IDENTIFIER"
                exit 1
              fi
            done
          done

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The packages the "go test without -race (allocation tests)" step runs
      # whole; the allocation-budget step's !race guard reads the same list.
      NORACE_PKGS: ./internal/codec/ ./internal/wire/ ./internal/testsupport/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # -coverpkg=./... instruments every package in every test binary, so a
      # block counts as covered when any test of the module runs it: code
      # that one package's tests drive through another's API is credited
      # where it lives.
      #
      # `go tool -n covdata` builds the covdata tool into the build cache
      # before the tests, in this step's environment (the cache entry
      # depends on it) and without `|| true`. Otherwise go test's covdata
      # processes for the packages without tests (the examples) each build
      # it into the same cache entry, in place, and one can exec the file
      # while another writes it: "fork/exec .../covdata: text file busy" on
      # Linux although every package is ok. On Linux the step lists the
      # files named covdata in GOCACHE (inode, size, mtime) after the warm-up
      # and after the test command, and fails when the first list lacks the
      # path the warm-up printed or the two lists differ: either means the
      # test command's processes may still build the tool.
      - name: go test -race with coverage
        run: |
          tool="$(go tool -n covdata)"
          echo "go tool -n covdata: $tool"
          # Each file named covdata in GOCACHE with its inode, size and
          # mtime; -printf is GNU find's, hence Linux only.
          covdata_files() {
            find "$(go env GOCACHE)" -type f -name covdata -printf '%i %s %TY-%Tm-%Td %TT %p\n' | sort
          }
          if [ "$RUNNER_OS" = Linux ]; then
            before="$(covdata_files)"
            printf 'files named covdata in GOCACHE after the warm-up:\n%s\n' "$before"
            if ! grep -qF -- " $tool" <<<"$before"; then
              echo "::error::the path the warm-up printed, $tool, is not among the files named covdata in GOCACHE"
              exit 1
            fi
          fi
          # The test command's status is kept until the second list is out.
          set +e
          go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
          status=$?
          set -e
          if [ "$RUNNER_OS" = Linux ]; then
            after="$(covdata_files)"
            printf 'files named covdata in GOCACHE after the test command:\n%s\n' "$after"
            if [ "$after" != "$before" ]; then
              echo "::error::the test command changed the files named covdata in GOCACHE: the warm-up did not reach the entry it uses"
              exit 1
            fi
          fi
          exit "$status"

      # Allocation counts need a normal build: under -race sync.Pool.Put drops
      # one value in four, so the codec allocation tests skip themselves there.
      - name: go test without -race (allocation tests)
        run: |
          read -ra pkgs <<<"$NORACE_PKGS"
          go test -count=1 "${pkgs[@]}"

      # The allocation budgets: the root package's, which internal/alloctest
      # holds (it measures the stages internal/engine holds, which the root
      # package's calls run), each built with //go:build !race
      # (GOROOT/src/sync/pool.go:104-107: under -race Put drops one value in
      # four), with the floods' time ratio, whose bound is asserted here,
      # without -race; and internal/codec's, which skip themselves under -race
      # (the step above runs them too, without their output). Each list is the
      # one place that names its package's tests: the pattern is built from it
      # and the -list guard counts the tests the pattern matches against its
      # length, so a renamed or deleted test fails the step instead of leaving
      # it with less to run; and a test that the step should run but its list
      # lacks fails it too: a test of a !race file of internal/alloctest, or
      # an internal/codec test that calls raceEnabled(). A tracked test file
      # built only without -race in a package that no step without -race runs,
      # one neither this step's nor $NORACE_PKGS, fails the step by name.
      - name: go test without -race (allocation budgets)
        run: |
          # The two packages whose lists this step runs; the !race guard
          # below reads the same two names.
          root_pkg=./internal/alloctest/
          codec_pkg=./internal/codec/
          root=(
            TestAllocPrepare         # Prepare's pinned counts
            TestAllocFalsyJSON       # Prepare: truthy criteria not copied
            TestAllocEncode          # one request body per size, every state kind
            TestAllocScratchSequence # the mixed-size sequence of 32 calls
            TestAllocDecodeFixtures  # one decode of every fixture
            TestLinearityFlood       # the floods' allocation ratio and members visited
            TestLinearityFloodTime   # the floods' time ratio, its bound asserted only here, without -race
            TestAllocWholeCall       # one whole call, N = 12
            TestAllocAnswersInlineBound # a call's inline answer entries' bound
            TestMemStatsCap          # the response cap's heap bounds per attempt
            TestMemStatsFlood        # the structured flood's peak and what stays live
            TestAllocResponseJSON    # response payloads
            TestAllocTypedDecode     # DecodeAs against the Answers() decode
            TestAllocTypedFailure    # a typed failure's error, its path rendered once
            TestAllocLoggedCall      # what logging costs a call
            TestAllocRequestID       # a logged request id's cost
            TestAllocSecretHeaderName # redaction by name without a copy
          )
          codec=(
            TestEncodeStateAllocations          # the state encode alone
            TestLazyPassAllocations             # the lazy pass, c0 + c1 x members visited
            TestNewBodyAllocations              # taking a body, and the sequence's call 23
            TestPretouchFirstCallCostsAWarmCall # after Pretouch a first encode costs a warm one
            TestDecoderPoolRetention            # the decoder pool's ceiling, GOMAXPROCS 1
          )
          # require_listed WHAT NAMES LIST...: every name of NAMES (one per
          # line) must be in LIST, or no step shows its output.
          require_listed() {
            local what=$1 names=$2
            shift 2
            local missing
            missing="$(comm -23 <(printf '%s\n' "$names" | sort -u) <(printf '%s\n' "$@" | sort -u))"
            if [ -n "$missing" ]; then
              echo "::error::$what missing from the list: ${missing//$'\n'/ }"
              exit 1
            fi
          }
          # A test file whose //go:build line includes !race is left out of
          # the -race step, so its tests run only in a step without -race:
          # this one, for the lists of $root_pkg and $codec_pkg, or the step
          # above, which runs the packages of $NORACE_PKGS whole. Every tracked test file
          # the go command builds (none under a _, . or testdata directory,
          # which ./... skips) must be in one of those packages, or its tests
          # run nowhere.
          read -ra whole <<<"$NORACE_PKGS"
          tests="$(git ls-files -- '*_test.go' ':!:adapter/' | grep -Ev '(^|/)([_.][^/]*|testdata)/')"
          if [ -z "$tests" ]; then
            echo "::error::git ls-files found no test file to check for !race"
            exit 1
          fi
          stray=""
          while IFS= read -r f; do
            case " $root_pkg $codec_pkg ${whole[*]} " in
              *" ./$(dirname "$f")/ "*) ;;
              *)
                names="$(grep -ho '^func Test[A-Za-z0-9_]*' "$f" | sed 's/^func //' | tr -d '\r' | tr '\n' ' ')" || true
                stray+=" $f (${names% })"
                ;;
            esac
          done < <(printf '%s\n' "$tests" | xargs grep -l -E '^//go:build .*!race' | tr -d '\r')
          if [ -n "$stray" ]; then
            echo "::error::test files built only without -race in a package no step without -race runs:$stray"
            exit 1
          fi
          # internal/codec cannot carry the constraint
          # (TestSeamBuildConstraints); its tests skip themselves under -race
          # by calling raceEnabled().
          require_listed "tests built only without -race" \
            "$(printf '%s\n' "$tests" | awk -v d="${root_pkg#./}" 'substr($0, 1, length(d)) == d && index(substr($0, length(d) + 1), "/") == 0' | xargs grep -l -E '^//go:build .*!race' | xargs grep -ho '^func Test[A-Za-z0-9_]*' | sed 's/^func //' | tr -d '\r')" \
            "${root[@]}"
          require_listed "internal/codec tests that skip under -race" \
            "$(awk '/^func / { name = ($2 ~ /^Test[A-Za-z0-9_]*\(/) ? $2 : ""; sub(/\(.*/, "", name) } /raceEnabled\(\)/ && name != "" { print name }' "${codec_pkg#./}"*_test.go | tr -d '\r')" \
            "${codec[@]}"
          # run_budgets PACKAGE TEST... guards and runs one list.
          run_budgets() {
            local pkg=$1
            shift
            local pattern listed
            pattern="^($(IFS='|'; echo "$*"))\$"
            listed="$(go test -list "$pattern" "$pkg" | grep -c '^Test')" || true
            if [ "$listed" != "$#" ]; then
              echo "::error::go test -list matched ${listed:-no} tests of the $# listed in $pkg: $pattern"
              exit 1
            fi
            go test -count=1 -run "$pattern" -v "$pkg"
          }
          run_budgets "$root_pkg" "${root[@]}"
          run_budgets "$codec_pkg" "${codec[@]}"

      # OIDC authentication: the action exchanges the job's id-token (hence
      # `id-token: write` above) and ignores any token input. It needs the
      # Codecov GitHub App installed on the repository. For a pull request
      # from a fork, which gets no id-token, the action detects the fork
      # (CC_FORK), skips OIDC and uploads without a token under the fork's head
      # label as the branch, the tokenless path Codecov accepts for public
      # repositories.
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # `disable_search` stops the action from walking the tree for other
          # coverage files, so the profile produced above is the only upload.
          files: coverage.out
          disable_search: true
          flags: ${{ matrix.os }}
          fail_ci_if_error: true

      - if: matrix.os == 'ubuntu-26.04'
        uses: astral-sh/setup-uv@v10.2.0

      # Every block that the -race step's profile leaves at zero,
      # outside the paths .codecov.yaml ignores, has a row with a reason in
      # docs/uncovered-lines.md, and no row outlives its block. It runs after
      # the upload, so a failure here still leaves Codecov its report, and on
      # one image: the document describes the ubuntu -race profile, and a
      # block that timing covers only sometimes has a range row there.
      - name: Every uncovered block has a reason (AC-Q2)
        if: matrix.os == 'ubuntu-26.04'
        run: uv run --script .github/scripts/uncovered-lines.py --profile coverage.out --doc docs/uncovered-lines.md

  # Every fuzz target for 60 s, in turn, one package per go test -fuzz
  # invocation; the job fails when any target finds an input that fails
  # (a panic, a failed property, or an input past the targets' 10 s
  # per-input bound, internal/testsupport/fuzz.go) and uploads those inputs.
  # The seed corpora (testdata/fuzz) also run in the test job, as tests.
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The lists are the one place that names the targets: `fuzzed` runs
      # each for FUZZTIME, `seeded` names the targets that run only their
      # seed corpus (in the test job). A target declared in the tree and in
      # neither list, a target in either list that go test -list does not
      # find, an empty fuzzed list or a scan that finds no target in the
      # tree fails the step before anything runs, so a new or renamed target
      # cannot drop out of the job unnoticed.
      - name: Fuzz every target
        env:
          FUZZTIME: 60s
        run: |
          fuzzed=(
            "./internal/codec FuzzDecodeResponse"  # both response decoders
            "./internal/codec FuzzErrorBody"       # the error-body reader
            "./internal/codec FuzzDecodePaths"     # the visitor vs lazy pass differential
            ". FuzzRetryAfter"                     # the Retry-After parser
            ". FuzzTagGrammar"                     # the struct tag grammar
            "./internal/engine FuzzFalsyJSON"      # the falsy-value check
            "./internal/engine FuzzIsSecretHeader" # the secret header names
            "./internal/codec FuzzValidUTF8"       # sonic's UTF-8 check vs utf8.Valid
          )
          seeded=(
            "./internal/codec FuzzAppendJSON"  # compaction vs encoding/json
            "./internal/codec FuzzValidString" # the string check
            "./internal/wire FuzzAppendJSON"   # compaction invariants
          )
          if [ "${#fuzzed[@]}" -eq 0 ]; then
            echo "::error::no fuzz target listed"
            exit 1
          fi
          # grep exits 1 for a batch of files without a target; under the
          # step's pipefail that must not end the step.
          declared="$({ git ls-files -z -- '*_test.go' ':!:adapter/' | xargs -0 grep -H -o '^func Fuzz[A-Za-z0-9_]*' || true; } |
            sed -E 's|^(.*)/[^/]*_test\.go:func (.*)$|./\1 \2|; s|^[^/]*_test\.go:func (.*)$|. \1|' | sort -u)"
          # The scan above cannot come back empty in this tree: an empty
          # result is a broken scan, which would let every list pass.
          if [ -z "$declared" ]; then
            echo "::error::the scan found no fuzz target in the tree"
            exit 1
          fi
          unlisted="$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "${fuzzed[@]}" "${seeded[@]}" | sort -u))"
          if [ -n "$unlisted" ]; then
            echo "::error::fuzz targets in neither list: $(tr '\n' ',' <<<"$unlisted")"
            exit 1
          fi
          for entry in "${fuzzed[@]}" "${seeded[@]}"; do
            read -r pkg target <<<"$entry"
            if [ "$(go test -list "^$target\$" "$pkg" | grep -cx "$target")" != 1 ]; then
              echo "::error::go test -list does not find $target in $pkg"
              exit 1
            fi
          done
          failed=()
          for entry in "${fuzzed[@]}"; do
            read -r pkg target <<<"$entry"
            echo "::group::$target ($pkg) for $FUZZTIME"
            if ! go test -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" "$pkg"; then
              failed+=("$target")
              echo "::error::$target failed"
            fi
            echo "::endgroup::"
          done
          # go test -fuzz writes each failing input to testdata/fuzz/<target>/
          # in its package; collect the new ones for the artifact.
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | while read -r f; do
            echo "failing input $f:"
            cat "$f"
            mkdir -p "$RUNNER_TEMP/fuzz-failures/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/fuzz-failures/$f"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::fuzz targets that failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
